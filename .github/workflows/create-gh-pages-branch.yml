name: Build web pages

on:
  workflow_dispatch:  # 手動実行トリガ
  workflow_call:      # 他フローからの呼び出しトリガ

env:
  DOCUMENT_BRANCH: "gh-pages"
  DOCUMENT_DIR: "docs"

jobs:
  build:
    name: Build gh-pages
    runs-on: ubuntu-24.04
    environment: github-pages
    permissions:
      actions: write
      checks: write
      contents: write
    steps:
      - name: Set current datetime as env variable
        env:
          TZ: 'Asia/Tokyo' # Set timezone
        run: echo "CURRENT_DATETIME=$(date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_ENV

      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set git-configs
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.14.0'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
      
      - name: Run vite build
        run: |
          npm run web:build
      
      # ビルド結果をバックアップ（中身だけをコピー）
      - name: Backup directory
        run: |
          mkdir -p ~/backup
          cp -r ./dist/web/* ~/backup

      # ブランチが無い場合は新規作成し、ある場合は切り替える
      - name: Switch branch
        run: | 
          git switch ${{ env.DOCUMENT_BRANCH }} 2>/dev/null || git switch --orphan ${{ env.DOCUMENT_BRANCH }}
      
      - name: Restore directory
        run: |
          mkdir -p ./${{ env.DOCUMENT_DIR }}
          cp -rf ~/backup/* ./${{ env.DOCUMENT_DIR }}
      
      - name: Commit and push
        run: |
          git add ${{ env.DOCUMENT_DIR }}
          if git diff --cached --quiet; then
            echo "変更がありません。スキップします。"
          else
            git commit -m "Deploy at ${{ env.CURRENT_DATETIME }}"
            git push origin ${{ env.DOCUMENT_BRANCH }}
          fi