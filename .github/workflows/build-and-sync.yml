name: Build and Sync to Public Repository

on:
  workflow_dispatch:

jobs:
  # ステップ1: gh-pagesブランチをビルド
  build-gh-pages:
    name: Build gh-pages
    uses: ./.github/workflows/create-gh-pages-branch.yml
    secrets: inherit
    permissions:
      actions: write
      checks: write
      contents: write

  # ステップ2: パブリックリポジトリへ同期
  sync-to-public:
    name: Sync to public repository
    needs: build-gh-pages
    uses: ./.github/workflows/sync-to-public-repo.yml
    secrets: inherit
    permissions:
      actions: write
      checks: write
      contents: write
