services:
  yrit-iot-burner-web:
    image: nginx:1.27.0
    volumes:
      - ./dist/web:/usr/share/nginx/html
      - ./nginx/custom-mime.conf:/etc/nginx/conf.d/custom-mime.conf
    tty: true
    stdin_open: true
    restart: unless-stopped
    ports:
      - 8080:80
    environment:
      - TZ=Asia/Tokyo
    container_name: yrit_iot_burner